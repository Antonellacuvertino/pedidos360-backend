services:
  app:
    build:
      context: ..
      dockerfile: ${SERVICE_NAME:?Define SERVICE_NAME}/Dockerfile
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?Define AZURE_TENANT_ID}
      AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:?Define AZURE_API_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS}
      DB_HOST: ${DB_HOST:?Define DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USER: ${DB_USER:?Define DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:?Define RABBITMQ_ADDRESSES}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFICATION_TO: ${NOTIFICATION_TO:-}
    ports:
      - "${SERVICE_PORT:?Define SERVICE_PORT}:${SERVICE_PORT}"
    restart: unless-stopped
