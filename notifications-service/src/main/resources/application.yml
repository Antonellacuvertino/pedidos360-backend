server:
  port: 8084

spring:
  application:
    name: notifications-service
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0
          audiences: ${AZURE_API_AUDIENCE:api://99523fae-980a-4c64-bde4-26e92c7376e9}

pedidos360:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  notifications:
    smtp-enabled: ${SMTP_ENABLED:false}
    default-to: ${NOTIFICATION_TO:}
    from: ${SMTP_FROM:${SMTP_USERNAME:}}

management:
  health:
    mail:
      enabled: ${SMTP_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
