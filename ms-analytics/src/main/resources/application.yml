server:
  port: 8089
spring:
  application:
    name: ms-analytics
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: cl.pedidos360.streaming
        spring.json.use.type.headers: true
    listener:
      ack-mode: record
      auto-startup: ${KAFKA_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0
          audiences: ${AZURE_API_AUDIENCE:7d7e6f82-35dc-4fd2-b580-7776c558d963}
management:
  endpoints:
    web:
      exposure:
        include: health,info
pedidos360:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
