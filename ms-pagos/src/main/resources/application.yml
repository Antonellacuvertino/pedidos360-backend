server:
  port: 8087
spring:
  application:
    name: ms-pagos
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0
          audiences: ${AZURE_API_AUDIENCE:7d7e6f82-35dc-4fd2-b580-7776c558d963}
management:
  endpoints:
    web:
      exposure:
        include: health,info
pedidos360:
  streaming:
    enabled: ${KAFKA_ENABLED:false}
  payments:
    fingerprint-pepper: ${PAYMENT_FINGERPRINT_PEPPER:demo-only-change-me}
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
